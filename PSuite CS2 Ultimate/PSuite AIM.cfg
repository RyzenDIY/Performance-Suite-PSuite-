// ============================================================================
// PSuite_AIM.cfg - Модуль прицілювання, кіберспортивного в'юмоделі та біндів
// ============================================================================
echo "Loading AIM..."

unbindall

bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "shift" "+sprint"
bind "ctrl" "+duck"

bind "space" "+jump"
bind "mwheelup" "+jump"
bind "mwheeldown" "+jump"

bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "z" "slot6"  // HE
bind "x" "slot7"  // Flash
bind "c" "slot8"  // Smoke
bind "v" "slot10" // Molotov
bind "f" "slot9"  // Decoy

alias "+boing" "+jump"
alias "+ding" "-attack; -attack2"
alias "+dong" "-jump"
bind "h" "+boing; +ding; +dong"

bind "q" "switchhands"

alias "+scores" "+showscores; cl_hud_telemetry_ping_show 2; cl_hud_telemetry_net_misdelivery_show 2; cl_hud_telemetry_frametime_show 2"
alias "-scores" "-showscores; cl_hud_telemetry_ping_show 0; cl_hud_telemetry_net_misdelivery_show 0; cl_hud_telemetry_frametime_show 0"
bind "tab" "+scores"

viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2.0"
viewmodel_offset_z "-2.0"
cl_usenewbob "false"
zoom_sensitivity_ratio "1.0"

cl_radar_always_centered "false"
cl_radar_scale "0.4"
cl_radar_icon_scale_min "0.6"

alias "ch_color_base" "cl_crosshaircolor 5; cl_crosshaircolor_r 0; cl_crosshaircolor_g 255; cl_crosshaircolor_b 0; cl_crosshairusealpha 1; cl_crosshairalpha 255"
alias "x_style1" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 2; cl_crosshairthickness 0.5; cl_crosshairgap -2; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 0"
alias "x_style2" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 1.5; cl_crosshairthickness 1; cl_crosshairgap -3; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 0"
alias "x_style3" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 0; cl_crosshairthickness 2; cl_crosshairgap -5; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 1"
alias "x_style4" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 3; cl_crosshairthickness 0.5; cl_crosshairgap -1; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 0"
alias "x_style5" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 2; cl_crosshairthickness 0.5; cl_crosshairgap -2; cl_crosshair_drawoutline 0; cl_crosshair_outlinethickness 0; cl_crosshairdot 0"
alias "x_style6" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 1; cl_crosshairthickness 1; cl_crosshairgap -4; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 0"
alias "x_style7" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 2.5; cl_crosshairthickness 0.7; cl_crosshairgap -2; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 0"
alias "x_style8" "ch_color_base; cl_crosshairstyle 4; cl_crosshairsize 2; cl_crosshairthickness 1; cl_crosshairgap 0; cl_crosshair_drawoutline 1; cl_crosshair_outlinethickness 1; cl_crosshairdot 0"

alias "cycle_ch" "ch_1"
alias "ch_1" "x_style1; alias cycle_ch ch_2"
alias "ch_2" "x_style2; alias cycle_ch ch_3"
alias "ch_3" "x_style3; alias cycle_ch ch_4"
alias "ch_4" "x_style4; alias cycle_ch ch_5"
alias "ch_5" "x_style5; alias cycle_ch ch_6"
alias "ch_6" "x_style6; alias cycle_ch ch_7"
alias "ch_7" "x_style7; alias cycle_ch ch_8"
alias "ch_8" "x_style8; alias cycle_ch ch_1"

bind "alt" "cycle_ch"
ch_1

bind "e" "+use"
bind "r" "+reload"
bind "g" "drop"
bind "t" "+spray_menu"
bind "u" "messagemode2"
bind "y" "messagemode"
bind "mouse1" "+attack"
bind "mouse2" "+attack2"
bind "escape" "cancelselect"

bind "kp_1" "buy vesthelm;"
bind "kp_2" "buy vest;"
bind "kp_3" "buy defuser;"
bind "kp_4" "buy m4a1_silencer; buy ak47;"
bind "kp_5" "buy awp;"
bind "kp_6" "buy flashbang;"
bind "kp_7" "buy smokegrenade;"
bind "kp_8" "buy hegrenade;"
bind "kp_9" "buy molotov; buy incgrenade;"

alias "practice" "sv_cheats 1; mp_roundtime_defuse 60; mp_buytime 60000; mp_buy_anywhere 1; mp_maxmoney 60000; mp_startmoney 60000; mp_infinite_ammo 1; ammo_grenade_limit_total 6; sv_infinite_clicks true; sv_grenade_trajectory_prac_pipreview true; sv_grenade_trajectory_prac_trailtime 8; mp_restartgame 1"
bind "p" "practice"
